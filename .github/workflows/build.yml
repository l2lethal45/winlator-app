# L2 Lethal - compila el APK en GitHub (no hace falta Android Studio)
name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar
        env:
          L2_FIRMA: ${{ secrets.L2_FIRMA || secrets.L2_SECRET }}
        run: |
          mkdir -p logs
          exec > >(tee logs/build.log) 2>&1
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" | tail -5
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +x
          if [ -n "$L2_FIRMA" ]; then
            echo "$L2_FIRMA" | cut -d'|' -f2 | base64 -d > "$RUNNER_TEMP/l2lethal.jks"
            export L2_KEYSTORE="$RUNNER_TEMP/l2lethal.jks"
            export L2_KEYPASS="$(echo "$L2_FIRMA" | cut -d'|' -f1)"
            echo "Firma L2 Lethal: SI"
          else
            echo "Firma L2 Lethal: NO (APK de prueba, no se publica)"
          fi
          set -x
          python3 -m pip install -q --break-system-packages zstandard || python3 -m pip install -q zstandard || exit 1
          python3 tools/l2_repath.py app/src/main/assets || exit 1
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK (solo si esta firmado con la llave de L2 Lethal)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          L2_FIRMA: ${{ secrets.L2_FIRMA || secrets.L2_SECRET }}
        run: |
          if [ -z "$L2_FIRMA" ]; then echo "Sin firma: no se publica"; exit 0; fi
          cp app/build/outputs/apk/debug/app-debug.apk L2Lethal.apk
          python3 tools/l2_check_apk.py L2Lethal.apk | tee -a logs/build.log || exit 1
          sha256sum L2Lethal.apk | tee -a logs/build.log
          VC=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          gh release create "build-${{ github.run_number }}" L2Lethal.apk --repo "${{ github.repository }}" \
            --title "L2 Lethal Android - build ${{ github.run_number }}" \
            --notes "Winlator 11.2 modificado para L2 Lethal (commit ${{ github.sha }}). Codigo fuente: este repositorio (LGPL 2.1). versionCode=$VC" --latest

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Guardar registro (rama logs)
        if: always()
        run: |
          mkdir -p /tmp/l
          cp -r logs/* /tmp/l/ 2>/dev/null || echo "sin logs" > /tmp/l/build.log
          echo "${{ job.status }} $(date -u) ${{ github.sha }}" > /tmp/l/resultado.txt
          ls -la app/build/outputs/apk/debug/ >> /tmp/l/resultado.txt 2>&1 || true
          cd /tmp/l && git init -q && git checkout -q -b logs
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "log ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
