# L2 Lethal - compila el APK en GitHub (no hace falta Android Studio)
name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK y CMake
        run: sdkmanager "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
