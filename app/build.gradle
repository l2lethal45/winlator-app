apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.l2lethal'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 40
        versionName "11.2-L2Lethal-8"
    }

    // L2 Lethal: firma fija (la llave viene del secreto L2_FIRMA de GitHub). Sin ella, firma de prueba.
    signingConfigs {
        l2lethal {
            storeFile file(System.getenv("L2_KEYSTORE") ?: "sin-llave.jks")
            storePassword System.getenv("L2_KEYPASS") ?: ""
            keyAlias "l2lethal"
            keyPassword System.getenv("L2_KEYPASS") ?: ""
        }
    }

    buildTypes {
        debug {
            if (System.getenv("L2_KEYSTORE")) signingConfig signingConfigs.l2lethal
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.12'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
